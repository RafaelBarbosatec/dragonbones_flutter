name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Verifies the committed reference dumps are actually reproducible from the
  # official DragonBones runtime — i.e. the oracle really is the oracle.
  oracle:
    name: Oracle dumps reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build official runtime
        run: tool/ground_truth/fetch_runtime.sh
      - name: Regenerate dumps
        run: tool/ground_truth/run_all.sh
      - name: Assert dumps unchanged
        run: |
          if ! git diff --quiet -- tool/ground_truth/out; then
            echo "::error::Committed reference dumps differ from freshly generated ones."
            git diff --stat -- tool/ground_truth/out
            exit 1
          fi
          echo "Reference dumps are reproducible."

  # The runtime is pure Dart with zero dependencies, so it is analysed and
  # tested without Flutter. The oracle diff is the real test: it replays the
  # hand-picked ladder AND all 44 Unity SDK demo assets frame by frame,
  # comparing every bone matrix, every slot's draw data, every mesh's posed
  # vertices and every flattened nested-armature slot against the official
  # runtime. No GPU, no eyeballing.
  runtime:
    name: dragonbones (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dragonbones
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - run: dart pub get
      # NOTE: `--no-fatal-infos` does not exist for `dart analyze` (that is a
      # Flutter flag); infos are already non-fatal here, warnings are fatal.
      - run: dart analyze
      # pub.dev scores formatting: pana runs `dart format --output=none
      # --set-exit-if-changed` over the package with its own options file, into
      # which it passes this package's `formatter:` section through — so the
      # `page_width: 120` in analysis_options.yaml is what pub.dev uses too.
      # Gate it here rather than discovering it at publish time.
      - name: Formatting (what pub.dev scores)
        run: dart format --output=none --set-exit-if-changed .
      - name: Structural check (parse fixtures)
        run: dart run tool/parse_check.dart
      - name: Diff against the official runtime (oracle)
        run: dart run tool/check_against_oracle.dart
      - name: Test
        run: |
          if [ -d test ]; then
            dart test --reporter expanded
          else
            echo "no tests yet"
          fi

  # Compiles and smoke-tests the Canvas renderer. There is no GPU on a runner,
  # so this cannot judge how it *looks* — but it does prove the renderer wires
  # up: every slot resolves its atlas, nothing is silently skipped, and drawing
  # a full animation loop raises nothing.
  renderer:
    name: dragonbones_flutter (analyze + render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dragonbones_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Analyze the example app
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

  # Keeps the "publishable" claim honest for the runtime: a package that would
  # fail `pub publish` should fail CI instead of failing on release day. The
  # dry-run never uploads anything.
  #
  # The renderer is deliberately NOT dry-run here. It depends on `dragonbones`
  # through a `path:`, and `pub publish` rejects path dependencies outright
  # ("Don't depend on ... from the path source"). That failure is expected and is
  # precisely why the runtime has to be released first — see docs/publishing.mdx.
  # Everything else about the renderer's archive is covered by the renderer job.
  publishable:
    name: publish dry-run (runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dragonbones
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'
      - run: dart pub get
      - run: dart pub publish --dry-run

  # The documentation site is generated from docs/ by docs.page, so broken
  # frontmatter, a dead internal link or an MDX file that will not render should
  # fail here, not in public.
  #
  # `--external-links off` is deliberate: the default (`error`) makes real HTTP
  # requests for every external URL, including to hosts that do not exist yet
  # (the pub.dev pages, before the first release). That hangs rather than fails,
  # so only the deterministic checks are gated.
  docs:
    name: docs.page (frontmatter, links, MDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @docs.page/cli check --external-links off
