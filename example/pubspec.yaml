name: dragonbones_example
description: Example app drawing a DragonBones animation on a Flutter Canvas.
publish_to: none
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dragonbones_flutter:
    path: ../packages/dragonbones_flutter
  bonfire: ^4.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

# Every directory under assets/ is declared here, one per character. Flutter has
# no recursive asset globbing, so a directory that is not listed simply never
# reaches the app -- and the list has to track the files. It is generated, and
# `tool/assets/check_example_assets.dart` (run in CI) fails if this list, the
# generated Dart catalogue and the directories on disk disagree.
flutter:
  uses-material-design: true
  assets:
    - assets/bounding_box_tester/
    - assets/bullet_01/
    - assets/dragon/
    - assets/floor_board/
    - assets/mecha_1002_101d_light/
    - assets/mecha_1002_101d_show/
    - assets/mecha_1004d/
    - assets/mecha_1004d_show/
    - assets/mecha_1406/
    - assets/mecha_1502b/
    - assets/mecha_2903/
    - assets/progress_bar/
    - assets/skin_1502b/
    - assets/weapon_1000/
    - assets/weapon_1004_show/
    - assets/you_xin/body/
    - assets/you_xin/suit1/2010600a/
    - assets/you_xin/suit1/2010600a_1/
