name: dragonbones
description: 'Pure-Dart runtime for the DragonBones 5.x skeletal animation format: parses DragonBones Pro exports and evaluates armature, bone, mesh and IK timelines. Zero dependencies.'
version: 0.1.1
repository: https://github.com/RafaelBarbosatec/dragonbones_flutter
documentation: https://docs.page/RafaelBarbosatec/dragonbones_flutter
issue_tracker: https://github.com/RafaelBarbosatec/dragonbones_flutter/issues
topics:
  - dragonbones
  - skeletal-animation
  - animation
  - gamedev

environment:
  sdk: '>=3.0.0 <4.0.0'

# Intentionally ZERO runtime dependencies: the runtime must be verifiable with a
# bare Dart SDK (no Flutter, no platform channels), and stay usable on web.
dependencies: {}

dev_dependencies:
  test: ^1.25.0
