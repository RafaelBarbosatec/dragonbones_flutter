name: dragonbones_flutter
description: 'Draw DragonBones skeletal animations on a Flutter Canvas: update(dt) + render(Canvas), plus a ready-made widget and no game engine dependency.'
version: 0.1.1
repository: https://github.com/RafaelBarbosatec/dragonbones_flutter
documentation: https://docs.page/RafaelBarbosatec/dragonbones_flutter
issue_tracker: https://github.com/RafaelBarbosatec/dragonbones_flutter/issues
topics:
  - dragonbones
  - skeletal-animation
  - gamedev
  - canvas

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  dragonbones: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# NOTE: no `assets:` section on purpose. The renderer takes an already-decoded
# `ui.Image`, so it never touches the bundle itself; the example app declares
# whatever assets it wants to load.
